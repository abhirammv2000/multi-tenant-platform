apiVersion: v1
kind: ServiceAccount
metadata:
  name: reverse-proxy-sa
---
# The proxy watches every tenant's EndpointSlices, so this is a ClusterRole. It is
# read only and limited to endpointslices.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reverse-proxy-endpointslices-reader
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reverse-proxy-endpointslices-reader-binding
subjects:
  - kind: ServiceAccount
    name: reverse-proxy-sa
    namespace: platform
roleRef:
  kind: ClusterRole
  name: reverse-proxy-endpointslices-reader
  apiGroup: rbac.authorization.k8s.io
