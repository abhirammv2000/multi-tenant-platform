name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the tests
        # No database or cluster is used: the engine is created but never connects, and the
        # Kubernetes calls are replaced. These values only have to exist.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
          DATABASE_URL_SYNC: postgresql+psycopg2://ci:ci@localhost/ci
          API_KEY_SECRET: ci
          ADMIN_SECRET_KEY: ci
        run: python -m pytest -q
